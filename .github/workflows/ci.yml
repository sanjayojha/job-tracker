name: CI

# Prose changes cannot break a build, so they do not spend a run. A commit
# touching both docs and code still runs: paths-ignore only skips when *every*
# changed file matches. Workflow files are deliberately absent from the list --
# a change to CI itself must be tested by CI.
#
# Safe here only because no status check is required for merging. If branch
# protection is ever added, a skipped run reports nothing at all and the PR
# waits forever on a check that will never arrive.
# The list is duplicated because GitHub Actions does not support YAML anchors.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      # Must match the engine and major version used locally and in production.
      # Testing on anything else defeats the point of not using SQLite.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Test (Pest)
        # phpunit.xml points DB_HOST at DDEV's `db` hostname, which does not
        # exist here. PHPUnit's <env> defaults to force="false", so a real
        # environment variable takes precedence over it.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: php artisan test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      - name: Build (also typechecks via tsc -b, test files included)
        run: npm run build
